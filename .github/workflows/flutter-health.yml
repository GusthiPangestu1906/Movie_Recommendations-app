name: Flutter Health Check

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ main, master ]

concurrency:
  group: health-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health-check:
    name: Asset & Code Health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true # Mempercepat loading SDK

      - name: Get Dependencies
        run: flutter pub get

      - name: Create dummy .env for health check
        run: touch .env

      - name: Verify Assets Existence
        run: |
          echo "🔍 Memverifikasi integritas file asset..."
          flutter build bundle --debug

      - name: Detect Production Prints
        run: |
          echo "🔍 Mencari print() statements yang tertinggal..."
          PRINTS=$(grep -r "print(" lib/ --exclude-dir=.dart_tool || true)
          if [ -n "$PRINTS" ]; then
            echo "⚠️ PERINGATAN: Ditemukan penggunaan print() di kode Anda."
            echo "Gunakan 'debugPrint()' agar log tidak muncul di versi rilis."
          else
            echo "✅ Clean. Tidak ada print() ditemukan."
          fi
