name: Dependency Vulnerability Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * 1' # Berjalan otomatis setiap Senin jam 12 malam untuk cek celah baru

jobs:
  vulnerability-scan:
    name: OSV-Scanner (Google)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v1.9.0
        with:
          # Memindai pubspec.lock secara mendalam untuk mencari celah keamanan
          scan-args: |-
            --recursive
            ./

      - name: Alert on Vulnerabilities
        if: failure()
        run: |
          echo "❌ BAHAYA: Ditemukan celah keamanan pada package yang Anda gunakan!"
          echo "Segera jalankan 'flutter pub upgrade' atau update package ke versi terbaru."
