name: Android Build Check

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'scripts/**'

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Test Android Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Create dummy Firebase and Env files
        run: |
          touch .env
          mkdir -p android/app/src/debug
          # Buat dummy google-services.json yang lebih lengkap untuk melewati validasi Gradle
          echo '{"project_info":{"project_number":"123456789012","project_id":"dummy-id"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789012:android:dummyid","android_client_info":{"package_name":"com.nxrl.nyxdex"}},"api_key":[{"current_key":"dummy-key"}],"services":{}}],"configuration_version":"1"}' > android/app/google-services.json
          cp android/app/google-services.json android/app/src/debug/google-services.json

      - name: Build Debug APK
        run: flutter build apk --debug
