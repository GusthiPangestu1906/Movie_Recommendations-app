name: Deploy to Firebase Hosting on PR

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'scripts/**'
      - 'android/**'
      - 'ios/**'

concurrency:
  group: hosting-pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create dummy .env for build
        run: touch .env
          
      - name: Build Web
        run: |
          flutter build web --release \
            --dart-define=TMDB_API_KEY=${{ secrets.TMDB_API_KEY }} \
            --dart-define=FIREBASE_WEB_KEY=${{ secrets.FIREBASE_WEB_KEY }} \
            --dart-define=FIREBASE_PROJECT_ID=mymovies-app-project \
            --dart-define=FIREBASE_WEB_APP_ID=${{ secrets.FIREBASE_WEB_APP_ID }} \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }} \
            --dart-define=FIREBASE_AUTH_DOMAIN=mymovies-app-project.firebaseapp.com \
            --dart-define=FIREBASE_STORAGE_BUCKET=mymovies-app-project.appspot.com

      - name: Verify Web Build
        run: ls -R build/web

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MYMOVIES_APP_PROJECT }}'
          projectId: mymovies-app-project
