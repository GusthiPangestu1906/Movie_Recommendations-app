name: Secret Health Check

on:
  workflow_dispatch: 
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 12 * * *' # Setiap jam 12 siang

concurrency:
  group: health-secrets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-api-keys:
    name: Verify Secrets & Connectivity
    runs-on: ubuntu-latest
    steps:
      - name: Check TMDB API Key Connectivity
        run: |
          HTTP_STATUS=$(curl --silent --location "https://api.themoviedb.org/3/movie/popular?api_key=${{ secrets.TMDB_API_KEY }}" --output /dev/null --write-out "%{http_code}")
          
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ TMDB API Key VALID (Status 200)"
          elif [ "$HTTP_STATUS" -eq 401 ]; then
            echo "❌ ERROR: TMDB API Key INVALID / EXPIRED (Status 401)"
            exit 1
          else
            echo "⚠️ WARNING: TMDB API Connectivity Issue (Status $HTTP_STATUS)"
            exit 1
          fi

      - name: Check Firebase Secrets Presence
        shell: bash
        run: |
          status=0
          if [ -z "${{ secrets.FIREBASE_PROJECT_ID }}" ]; then echo "❌ MISSING: FIREBASE_PROJECT_ID"; status=1; fi
          if [ -z "${{ secrets.FIREBASE_WEB_KEY }}" ]; then echo "❌ MISSING: FIREBASE_WEB_KEY"; status=1; fi
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT_MYMOVIES_APP_PROJECT }}" ]; then echo "❌ MISSING: FIREBASE_SERVICE_ACCOUNT"; status=1; fi

          if [ $status -ne 0 ]; then
            echo ""
            echo "⚠️ ERROR: Beberapa Secret belum diisi di GitHub (Settings > Secrets > Actions)."
            exit 1
          else
            echo "✅ Semua Secret Firebase telah terkonfigurasi."
          fi
