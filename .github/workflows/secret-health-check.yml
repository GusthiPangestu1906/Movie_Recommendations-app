name: Secret Health Check

on:
  workflow_dispatch: 
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'assets/**'
  schedule:
    - cron: '0 12 * * *' # Setiap jam 12 siang

concurrency:
  group: health-secrets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-api-keys:
    name: Verify Secrets & Connectivity
    runs-on: ubuntu-latest
    steps:
      - name: Check TMDB API Key Connectivity
        run: |
          HTTP_STATUS=$(curl --silent --location "https://api.themoviedb.org/3/movie/popular?api_key=${{ secrets.TMDB_API_KEY }}" --output /dev/null --write-out "%{http_code}")
          
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ TMDB API Key VALID (Status 200)"
          elif [ "$HTTP_STATUS" -eq 401 ]; then
            echo "❌ ERROR: TMDB API Key INVALID / EXPIRED (Status 401)"
            exit 1
          else
            echo "⚠️ WARNING: TMDB API Connectivity Issue (Status $HTTP_STATUS)"
            exit 1
          fi

      - name: Check Firebase Config Presence
        run: |
          MISSING_SECRETS=()
          [[ -z "${{ secrets.FIREBASE_PROJECT_ID }}" ]] && MISSING_SECRETS+=("FIREBASE_PROJECT_ID")
          [[ -z "${{ secrets.FIREBASE_WEB_KEY }}" ]] && MISSING_SECRETS+=("FIREBASE_WEB_KEY")

          if [ ${#MISSING_SECRETS[@]} -ne 0 ]; then
            echo "❌ ERROR: Secret berikut belum dikonfigurasi di GitHub:"
            for secret in "${MISSING_SECRETS[@]}"; do echo "  - $secret"; done
            exit 1
          else
            echo "✅ Semua Secret Firebase esensial telah terkonfigurasi."
          fi
