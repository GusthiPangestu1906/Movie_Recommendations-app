name: Deploy to Firebase Hosting on merge\non:\n  push:\n    branches:\n      - main\njobs:\n  build_and_deploy:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      \n      - name: Setup Flutter\n        uses: subosito/flutter-action@v2\n        with:\n          channel: 'stable'\n          \n      - name: Build Web\n        run: flutter build web --release --dart-define=TMDB_API_KEY=${{ secrets.TMDB_API_KEY }} --dart-define=FIREBASE_WEB_KEY=${{ secrets.FIREBASE_WEB_KEY }} --dart-define=FIREBASE_ANDROID_KEY=${{ secrets.FIREBASE_ANDROID_KEY }} --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}\n\n      - uses: FirebaseExtended/action-hosting-deploy@v0\n        with:\n          repoToken: ${{ secrets.GITHUB_TOKEN }}\n          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MYMOVIES_APP_PROJECT }}\n          channelId: live\n          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}\n