<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="My Movies - Cinematic Universe">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My Movies">
  <meta name="theme-color" content="#0B0E1E">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>My Movies</title>
  <link rel="manifest" href="manifest.json">

  <!-- PRELOAD BACKGROUND IMAGE (Kunci Speed Index) -->
  <link rel="preload" href="https://images.unsplash.com/photo-1477346611705-65d1883cee1e?q=80&w=800&auto=format,webp&fit=crop" as="image">
  <link rel="preload" href="main.dart.js" as="script">

  <style>
    body {
      inset: 0; overflow: hidden; margin: 0; padding: 0; position: fixed;
      background-color: #0B0E1E;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column;
      font-family: -apple-system, sans-serif;
      color: white;
    }
    .loading-container {
      display: flex; flex-direction: column; align-items: center;
      z-index: 10;
    }
    .loading {
      width: 25px; height: 25px;
      border: 2px solid rgba(255,255,255,0.05);
      border-top: 2px solid #5C6AC4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 10px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .logo-text { letter-spacing: 4px; font-weight: 300; font-size: 9px; opacity: 0.4; }
  </style>
</head>
<body>
  <div id="loading-indicator" class="loading-container">
    <div class="loading"></div>
    <div class="logo-text">SYSTEM STARTING</div>
  </div>

  <script>
    _flutter.loader.loadEntrypoint({
      serviceWorker: { serviceWorkerVersion: "$SERVICE_WORKER_VERSION" },
      onEntrypointLoaded: function(engineInitializer) {
        engineInitializer.initializeEngine({
          renderer: "html"
        }).then(function(appRunner) {
          var loader = document.getElementById('loading-indicator');
          if (loader) loader.remove();
          appRunner.runApp();
        });
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
