<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="nyxdex - Cinematic Universe">

  <title>nyxdex</title>
  <!-- Cache buster v3 untuk memaksa refresh favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=3">
  <link rel="apple-touch-icon" href="favicon.png?v=3">
  <link rel="manifest" href="manifest.json">

  <style>
    /* Splash screen minimalis saat loading awal */
    body {
      background-color: #010203;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    .nyx-initial-spinner {
      width: 35px;
      height: 35px;
      border: 3px solid rgba(92, 106, 196, 0.1);
      border-top: 3px solid #5C6AC4;
      border-radius: 50%;
      animation: nyx-spin 0.8s linear infinite;
    }
    @keyframes nyx-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="nyx-initial-spinner"></div>
  <!-- Menggunakan standar bootstrap terbaru tanpa window.flutterConfiguration manual -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
