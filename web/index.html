<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="My Movies - Cinematic Universe">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My Movies">
  <meta name="theme-color" content="#0B0E1E">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>My Movies</title>
  <link rel="manifest" href="manifest.json">

  <!-- Preconnect & Preload -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="main.dart.js" as="script">

  <style>
    body {
      inset: 0; overflow: hidden; margin: 0; padding: 0; position: fixed;
      background-color: #0B0E1E;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: white;
    }
    .loading-container {
      display: flex; flex-direction: column; align-items: center;
    }
    .loading {
      width: 40px; height: 40px;
      border: 2px solid rgba(255,255,255,0.05);
      border-top: 2px solid #5C6AC4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 15px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .logo-text {
      letter-spacing: 5px; font-weight: 300; font-size: 12px; opacity: 0.6;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.7; } }
  </style>
</head>
<body>
  <div id="loading-indicator" class="loading-container">
    <div class="loading"></div>
    <div class="logo-text">LOADING SYSTEM</div>
  </div>

  <script>
    window.addEventListener('load', function(ev) {
      // Optimasi: Memaksa penggunaan HTML renderer untuk TBT yang lebih rendah di Mobile
      // Jika ingin CanvasKit di Desktop, gunakan 'auto'
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: "$SERVICE_WORKER_VERSION",
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine({
            renderer: "html",
            useColorEmoji: true
          }).then(function(appRunner) {
            var loader = document.getElementById('loading-indicator');
            if (loader) {
              loader.style.opacity = '0';
              setTimeout(function() { loader.remove(); }, 300);
            }
            appRunner.runApp();
          });
        }
      });
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
