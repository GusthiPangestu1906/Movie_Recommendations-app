<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="My Movies - Cinematic Universe">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My Movies">
  <meta name="theme-color" content="#0B0E1E">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>My Movies</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      inset: 0; overflow: hidden; margin: 0; padding: 0; position: fixed;
      background-color: #0B0E1E;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column;
      font-family: -apple-system, sans-serif;
      color: white;
    }
    .loading-container {
      display: flex; flex-direction: column; align-items: center;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="loading-indicator" class="loading-container">
    <!-- Spinner sudah dihapus -->
  </div>

  <script>
    window.addEventListener('load', function(ev) {
      _flutter.loader.load({
        serviceWorker: {
          serviceWorkerVersion: "$SERVICE_WORKER_VERSION",
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine({
            renderer: "html",
          }).then(function(appRunner) {
            var loader = document.getElementById('loading-indicator');
            if (loader) loader.remove();
            appRunner.runApp();
          });
        }
      });
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
