<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="My Movies - Cinematic Universe">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My Movies">
  <meta name="theme-color" content="#0B0E1E">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>My Movies</title>
  <link rel="manifest" href="manifest.json">

  <!-- Preconnect to external sources -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://image.tmdb.org">

  <style>
    body {
      inset: 0; overflow: hidden; margin: 0; padding: 0; position: fixed;
      background-color: #0B0E1E;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column;
      font-family: sans-serif;
      color: white;
    }
    .loading {
      width: 50px; height: 50px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top: 3px solid #5C6AC4;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .logo-text {
      letter-spacing: 4px; font-weight: bold; font-size: 14px; opacity: 0.8;
    }
  </style>
</head>
<body>
  <div id="loading-indicator">
    <div class="loading"></div>
    <div class="logo-text">MY MOVIES</div>
  </div>

  <script>
    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: "$SERVICE_WORKER_VERSION",
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            // Remove loading indicator when app is ready
            var loader = document.getElementById('loading-indicator');
            if (loader) loader.remove();
            appRunner.runApp();
          });
        }
      });
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
